<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi mamá ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 40px;
    font-size: 3em;
    animation: latido 1.5s infinite;
}

@keyframes latido {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.mensaje {
    font-size: 1.4em;
    margin: 20px;
    opacity: 0;
    animation: aparecer 2s forwards;
}

@keyframes aparecer {
    to { opacity: 1; }
}

/* Corazones */
.corazon {
    position: absolute;
    color: rgba(255,255,255,0.8);
    font-size: 20px;
    animation: caer linear infinite;
}

@keyframes caer {
    from {
        transform: translateY(-10vh);
    }
    to {
        transform: translateY(110vh);
    }
}

/* QR */
.qr {
    margin-top: 30px;
    background: white;
    padding: 10px;
    border-radius: 15px;
    display: inline-block;
}
</style>
</head>

<body>

<h1>Te amo mamá ❤️</h1>

<div class="mensaje" style="animation-delay: 1s;">
Gracias por darme la vida
</div>

<div class="mensaje" style="animation-delay: 3s;">
Gracias por cuidarme siempre
</div>

<div class="mensaje" style="animation-delay: 5s;">
Eres mi ejemplo, mi fuerza y mi hogar
</div>

<div class="mensaje" style="animation-delay: 7s;">
No hay palabras suficientes para decirte cuánto te amo
</div>

<div class="mensaje" style="animation-delay: 9s;">
Esto es para ti, con todo mi corazón 💖
</div>

<!-- MÚSICA -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- QR -->
<div class="mensaje" style="animation-delay: 11s;">
Escanea este código ❤️
</div>

<div class="qr" style="animation-delay: 12s;">
    <img 
      src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PEGA_AQUI_TU_LINK"
      width="200"
    >
</div>

<script>
// Corazones cayendo
for (let i = 0; i < 30; i++) {
    let c = document.createElement("div");
    c.className = "corazon";
    c.innerHTML = "❤️";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (3 + Math.random() * 5) + "s";
    c.style.fontSize = (15 + Math.random() * 20) + "px";
    document.body.appendChild(c);
}
</script>

</body>
</html>
